services:
  postgres:
    # Plain `postgres:16` does NOT include the pgvector extension — the first
    # migration's `CREATE EXTENSION IF NOT EXISTS vector` (required for the
    # `memories.embedding` column) would fail against it. `pgvector/pgvector` is
    # the pgvector project's own official image: the same postgres:16 with the
    # extension's files pre-installed, nothing else different.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: dineops
      POSTGRES_USER: dineops
      POSTGRES_PASSWORD: dineops_dev_password
    ports:
      - "5432:5432"
    volumes:
      - dineops_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dineops -d dineops"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://dineops:dineops_dev_password@postgres:5432/dineops
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../app:/app/app:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  dineops_postgres_data:
