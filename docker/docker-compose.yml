services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dineops
      POSTGRES_USER: dineops
      POSTGRES_PASSWORD: dineops_dev_password
    ports:
      - "5432:5432"
    volumes:
      - dineops_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dineops -d dineops"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://dineops:dineops_dev_password@postgres:5432/dineops
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../app:/app/app:ro

volumes:
  dineops_postgres_data:
